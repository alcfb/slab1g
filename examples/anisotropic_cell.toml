# Fuel / moderator lattice cell with linearly + higher-order anisotropic
# scattering in the moderator (forward-peaked, mean cosine ≈ 0.51) and mildly
# anisotropic scattering in the fuel. Reflected on both sides.
# sigma_s is the P0 (total) scattering cross section; sigma_s_l lists the
# higher Legendre moments [Σs1, Σs2, Σs3], with Σs1 = mean cosine × Σs0.
title = "Anisotropic fuel / moderator cell"

[mesh]
elements_per_mfp = 8
min_elements_per_zone = 16
degree = 2

[[zone]]
name = "fuel"
thickness = 0.5
sigma_s = 0.37
sigma_s_l = [0.03]
sigma_c = 0.12
sigma_f = 0.10
nu = 2.5

[[zone]]
name = "moderator"
thickness = 1.0
sigma_s = 1.20
sigma_s_l = [0.61, 0.20, 0.05]
sigma_c = 0.01
sigma_f = 0.0
