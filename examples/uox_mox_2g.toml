# Half a UOX assembly next to half a MOX assembly (21.5 cm pitch -> 10.75 cm each),
# reflective on both sides = infinite checkerboard of alternating UOX/MOX assemblies.
# Representative two-group homogenised assembly data (fresh fuel, group boundary
# 0.625 eV, chi = [1, 0], no up-scatter):
#   UOX ~4.2 % U-235: D = 1.44 / 0.39 cm, Σa = 0.0092 / 0.093, Σ1->2 = 0.0177, νΣf = 0.0062 / 0.137
#   MOX ~8.7 % Pu   : D = 1.43 / 0.38 cm, Σa = 0.0130 / 0.240, Σ1->2 = 0.0158, νΣf = 0.0095 / 0.360
# P1 self-scatter chosen to reproduce these D (D_g = 1/(3(Σt,g - Σs1,g->g))).
title = "UOX / MOX assemblies, two groups"
groups = 2
group_names = ["fast (> 0.625 eV)", "thermal (< 0.625 eV)"]
chi = [1.0, 0.0]

[mesh]
elements_per_mfp = 8
min_elements_per_zone = 32
degree = 2

[[zone]]
name = "UOX"
thickness = 10.75
sigma_s   = [[0.5200, 0.0177],
             [0.0000, 1.0000]]
sigma_s_l = [[[0.3154, 0.0000],
              [0.0000, 0.2383]]]
sigma_c = [0.00672, 0.0366]
sigma_f = [0.00248, 0.0564]
nu      = [2.50, 2.43]

[[zone]]
name = "MOX"
thickness = 10.75
sigma_s   = [[0.5200, 0.0158],
             [0.0000, 0.9500]]
sigma_s_l = [[[0.3157, 0.0000],
              [0.0000, 0.3128]]]
sigma_c = [0.00978, 0.1150]
sigma_f = [0.00322, 0.1250]
nu      = [2.95, 2.88]
