# KRUSTY (Kilopower) 2-D radial model as a 1-D cylinder, 9 groups, central B4C control rod INSERTED.
# Rod: the whole central hole (r < 1.9939 cm) filled with natural B4C, 2.52 g/cm3. Its 9-group cross
# sections are ESTIMATES (not from the OpenMC library, which has no absorber): B-10 (n,a) 1/v law
# averaged with a 1/E spectrum below 41 keV, typical values above; elastic B-10/B-11/C scattering;
# down-scatter xi*Ss/du plus inelastic at MeV energies; P1 self-scatter mu_bar*Ss(g->g).
# Cross sections: femcore benchmarks/krusty2d/mgxs/xs_9_groups_OPENMC.xml (branch interface-refactor),
# OpenMC macroscopic, transport-corrected. Here: Σt as given, P1 self-scatter Σs1(g->g) = Σt - Σa - Σ_g' Σs_corr(g->g'),
# Σs0 = corrected matrix + Σs1 on the diagonal (D = 1/(3Σtr) of the library).
# Geometry with every material area conserved: fuel 1.9939 - 5.2658 cm (real fuel area 74.6218 cm2),
# gap+HP 5.2658 - 7.1406 cm (vacuum chamber + all 8 heat pipes, 13.87 % heat pipe), BeO reflector to 19.2 cm.
