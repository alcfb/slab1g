[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "slab1g"
version = "0.1.0"
description = "One-group 1D slab k-eigenvalue: diffusion vs SP3 vs transport, solved with nutils"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["nutils>=9,<10", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
slab1g = "slab1g.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
